name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash runs with -eo pipefail, so a failing command in a pipe fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Playwright against a production build (vite preview). Kept out of the
    # `check` job's unit run; see apps/web/playwright.config.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: pnpm --filter @manufakture/web exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm --filter @manufakture/web e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  interop:
    # Optional: FreeCAD reopens our STEP and PrusaSlicer slices our 3MF and STL
    # (packages/io/src/interop.test.ts). Each check skips itself when its
    # program is missing, so a failed install skips it rather than failing,
    # and the job never blocks a merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install FreeCAD and PrusaSlicer
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freecad prusa-slicer xvfb
      - name: Interop checks
        run: |
          # PrusaSlicer's CLI links GTK; give it a virtual display.
          if command -v prusa-slicer > /dev/null; then export SLICER_CMD="xvfb-run -a prusa-slicer"; fi
          pnpm --filter @manufakture/io exec vitest run --root ../.. --project packages packages/io/src/interop.test.ts
