name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash runs with -eo pipefail, so a failing command in a pipe fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests, the G-code verifier over every golden G-code file (the `cam-gcode`
      # project) and the sync server's integration tests over a real server and SQLite file (the
      # `server` project); the kernel goldens run in their own job below.
      - run: pnpm test --project packages --project cam-gcode --project server --project web
      - run: pnpm build

  site:
    # The deployable site (T7.3c, docs/hosting.md): the production build in the production image
    # (deploy/Dockerfile: Caddy with deploy/Caddyfile, files precompressed with brotli and gzip),
    # run as the cluster runs it (read-only root, non-root user), with every header asserted by
    # deploy/check-headers.sh: cache rules, types, compression, the Content-Security-Policy, the
    # SPA fallback and its limits, and the source page naming this commit.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manufakture/web build
      - name: Build the image
        run: docker build -f deploy/Dockerfile --build-context site=apps/web/dist -t manufakture-web:ci deploy
      - name: Serve it and check the headers
        run: |
          docker run -d --name site -p 8080:8080 --read-only --tmpfs /tmp manufakture-web:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/healthz && break
            sleep 1
          done
          bash deploy/check-headers.sh http://localhost:8080 "$GITHUB_SHA"
      - name: Server log
        if: failure()
        run: docker logs site || true
      - name: Render the Kubernetes manifests
        # Placeholders only: the real host, secret and image are given at deploy time.
        run: |
          MANUFAKTURE_HOST=manufakture.example.internal MANUFAKTURE_TLS_SECRET=manufakture-tls \
            MANUFAKTURE_IMAGE=manufakture-web:ci deploy/render.sh > "$RUNNER_TEMP/manifests.yaml"
          if grep -n '\${MANUFAKTURE_' "$RUNNER_TEMP/manifests.yaml"; then exit 1; fi

  kernel-goldens:
    # The kernel's golden tests in one job: volume, face count and bounding box per feature
    # (features), exact measures (measure), STEP round trips (exchange) and the M1 bracket
    # (packages/kernel/test). The `kernel-goldens` project in vitest.config.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manufakture/kernel run goldens

  e2e:
    # Playwright against a production build (vite preview). Kept out of the
    # `check` job's unit run; see apps/web/playwright.config.ts.
    runs-on: ubuntu-latest
    # The M3 acceptance specs (e2e/m3-*.spec.ts) add about a minute locally, more under CI's
    # software rendering.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: pnpm --filter @manufakture/web exec playwright install --with-deps chromium
      - name: Run e2e tests
        # Includes the acceptance walkthroughs of M1 to M5 (e2e/m1-* to m5-*.spec.ts):
        # viewport screenshots against the committed baselines (never rewritten here), and the
        # performance budgets, which are written to this job's summary.
        run: pnpm --filter @manufakture/web e2e
      - name: Upload the M1 bracket exports for the interop job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-bracket
          path: apps/web/test-results/m1-bracket/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the M3 jig for printing
        # The PTFE tube cutting jig as Open in slicer exported it (e2e/m3-jig.spec.ts, chapter 8):
        # the 3MF for the print (docs/m3-acceptance.md) and what it should hold.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-jig
          path: apps/web/test-results/m3-jig/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the M5 sign G-code for the gcode-validate job
        # The plywood sign's exports (e2e/m5-sign.spec.ts): Grbl's one file per tool and the
        # Carbide Motion file, every one already through the G-code verifier, with numbers.json
        # (timings, file sizes, the estimated cut time). For the cut (docs/m5-acceptance.md).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-sign
          path: apps/web/test-results/m5-sign/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  script-browsers:
    # Scripted features give the same result in every browser (T7.2e, ADR 0010 decision 5): the
    # example scripts run in a module worker of Chromium, Firefox and WebKit under the production
    # worker policy, and each browser's recorded host calls, results and errors must equal a Node
    # run bit for bit (apps/web/e2e/scripting-cross-browser.spec.ts). It needs no app build, so it
    # runs on every push: about two runner minutes, most of it installing the three browsers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium, Firefox and WebKit with their system libraries
        run: pnpm --filter @manufakture/web exec playwright install --with-deps chromium firefox webkit
      - name: Run the example scripts in every browser
        env:
          E2E_CROSS_BROWSER: '1'
          E2E_SKIP_APP: '1'
        run: pnpm --filter @manufakture/web exec playwright test scripting-cross-browser
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: script-browsers-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  interop:
    # Optional: FreeCAD reopens our STEP and PrusaSlicer slices our 3MF and STL
    # (packages/io/src/interop.test.ts), for a part made in Node and for the
    # M1 bracket exported by the app in the e2e job; OrcaSlicer loads and slices
    # our 3MF and the slicer fixtures and must keep their names and filament
    # slots (profiles flattened into a temp dir at run time). Each check skips itself
    # when its program (or the bracket export) is missing, so a failed install
    # skips it rather than failing, and the job never blocks a merge.
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PrusaSlicer
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends prusa-slicer xvfb
      - name: Install FreeCAD
        # Ubuntu 24.04 has no freecad package, so use the upstream AppImage, extracted rather
        # than mounted (no FUSE needed).
        continue-on-error: true
        run: |
          curl -sSfLo "$RUNNER_TEMP/freecad.AppImage" \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          chmod +x "$RUNNER_TEMP/freecad.AppImage"
          (cd "$RUNNER_TEMP" && ./freecad.AppImage --appimage-extract > /dev/null)
          echo "FREECADCMD=$RUNNER_TEMP/squashfs-root/usr/bin/freecadcmd" >> "$GITHUB_ENV"
      - name: Install OrcaSlicer
        # The upstream AppImage, pinned by version and SHA-256, extracted into a directory of its
        # own (FreeCAD's is in squashfs-root above). Its command line needs no display, but its
        # binary links the GUI's libraries (GTK 3, WebKitGTK 4.1, GStreamer, OpenGL, ...), so
        # those are installed one by one: a package missing from the image only leaves Orca
        # unable to start, and the check then skips itself.
        continue-on-error: true
        run: |
          sudo apt-get update || true
          for p in libopengl0 libglu1-mesa libgl1 libegl1 libwayland-egl1 libxkbcommon0 \
                   libsm6 libice6 libgtk-3-0t64 libwebkit2gtk-4.1-0 libsoup-3.0-0 \
                   libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libmspack0t64; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "::warning::$p not installed"
          done
          curl -sSfLo "$RUNNER_TEMP/orca.AppImage" \
            https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage
          echo "d12fb8c8eac1aecd2dfb6377acd48f994f8fa439ed5292fa532dd82880f029fd  $RUNNER_TEMP/orca.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/orca.AppImage"
          mkdir -p "$RUNNER_TEMP/orca"
          (cd "$RUNNER_TEMP/orca" && ../orca.AppImage --appimage-extract > /dev/null)
          echo "ORCA_CMD=$RUNNER_TEMP/orca/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Download the M1 bracket exports
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m1-bracket
          path: m1-bracket
      - name: Interop checks
        run: |
          # PrusaSlicer's CLI links GTK; give it a virtual display.
          if command -v prusa-slicer > /dev/null; then export SLICER_CMD="xvfb-run -a prusa-slicer"; fi
          if [ -f m1-bracket/expected.json ]; then export INTEROP_BRACKET_DIR="$PWD/m1-bracket"; fi
          pnpm --filter @manufakture/io exec vitest run --root ../.. --project packages packages/io/src/interop.test.ts

  gcode-validate:
    # Optional: the firmware's own G-code parsers read every golden G-code file
    # (packages/cam/test/grbl) and the M5 sign's Grbl files from the e2e job (the m5-sign
    # artifact; the Carbide Motion file has M6, which neither validator takes): `gvalidate` from
    # grbl-sim, which builds Grbl 1.1h's parser on the host, and `grblHAL_validator` from the
    # grblHAL Simulator, each from a pinned commit (both GPL-3.0-or-later, built and run here
    # only, never shipped). A validator whose checkout or build fails is skipped with a warning,
    # as are the sign's files when the artifact is missing, and the job never blocks a merge. The
    # required checks are the `cam-gcode` project in the `check` job and the G-code verifier in
    # e2e/m5-sign.spec.ts (packages/cam/test/verify-gcode.ts).
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Grbl 1.1h
        id: grbl-src
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gnea/grbl
          ref: bfb67f0c7963fe3ce4aaf8a97f9009ea5a8db36e
          path: firmware/grbl
          persist-credentials: false
      - name: Check out grbl-sim
        # grbl-sim builds from inside Grbl's source directory.
        id: grbl-sim-src
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grbl/grbl-sim
          ref: 9bdd1654c7eb6cacf03e35340b38c962bcebe013
          path: firmware/grbl/grbl/grbl-sim
          persist-credentials: false
      - name: Build gvalidate
        if: ${{ steps.grbl-src.outcome == 'success' && steps.grbl-sim-src.outcome == 'success' }}
        continue-on-error: true
        run: |
          # GCC 10 and later default to -fno-common, and grbl-sim defines globals in headers.
          make -C firmware/grbl/grbl/grbl-sim gvalidate FLAGS="-O2 -fcommon"
          echo "GVALIDATE=$PWD/firmware/grbl/grbl/grbl-sim/gvalidate.exe" >> "$GITHUB_ENV"
      - name: Check out the grblHAL Simulator
        # Its core and SD card plugin are submodules, pinned by this commit.
        id: grblhal-src
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grblHAL/Simulator
          ref: 64a349832687ea14b7900c1ecb78e49b78e10c5a
          submodules: recursive
          path: firmware/grblhal
          persist-credentials: false
      - name: Build grblHAL_validator
        if: ${{ steps.grblhal-src.outcome == 'success' }}
        continue-on-error: true
        run: |
          # math.h first: glibc 2.43 declares C23's powr, which grblHAL's real.h defines as a
          # macro; harmless with older glibc.
          cmake -S firmware/grblhal -B firmware/grblhal/build -DCMAKE_C_FLAGS="-include math.h"
          cmake --build firmware/grblhal/build --target grblHAL_validator -j "$(nproc)"
          echo "GRBLHAL_VALIDATOR=$PWD/firmware/grblhal/build/grblHAL_validator" >> "$GITHUB_ENV"
      - name: Download the M5 sign G-code
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: m5-sign
          path: m5-sign
      - name: Validate the golden G-code files and the M5 sign's
        run: |
          files=(packages/cam/test/grbl/*.nc)
          if compgen -G "m5-sign/grbl/*.nc" > /dev/null; then
            files+=(m5-sign/grbl/*.nc)
          else
            echo "::warning::no M5 sign G-code from the e2e job; only the golden files are validated"
          fi
          status=0
          for name in GVALIDATE GRBLHAL_VALIDATOR; do
            if [ -z "${!name:-}" ] || [ ! -x "${!name}" ]; then
              echo "::warning::$name was not built; skipped"
              continue
            fi
            echo "== ${!name}"
            bash packages/cam/test/firmware-validate.sh "${!name}" "${files[@]}" || status=1
          done
          exit "$status"
